<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>话务中心 - 关闭事件接收</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    body { min-height: 100vh; overflow: hidden; }
    .confirm-page { position: relative; min-height: calc(100vh - 64px); display: grid; place-items: center; overflow: hidden; padding: 48px 24px; background: #f7fafd; }
    .confirm-page::before { content: ""; position: absolute; top: -28vh; right: 4vw; width: 44vw; height: 100vh; background: linear-gradient(135deg, rgba(22,119,255,.08), rgba(22,119,255,0)); transform: rotate(39deg); }
    .confirm-page::after { content: ""; position: absolute; right: 23vw; bottom: -32vh; width: 42vw; height: 86vh; border: 1px solid rgba(22,119,255,.12); transform: rotate(-43deg); }
    .dialog-shell { position: relative; z-index: 1; width: min(600px, calc(100vw - 48px)); padding: 24px; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
    .dialog-title { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; color: var(--text); font-size: 16px; font-weight: 500; }
    .warning-badge { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--danger); font-family: Georgia, serif; font-size: 13px; font-weight: 700; }
    .dialog-copy { min-height: 46px; margin: 0; color: var(--text-secondary); line-height: 22px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
    .result-panel { min-height: 154px; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .result-panel.is-visible { display: flex; }
    .result-icon { width: 40px; height: 40px; display: grid; place-items: center; margin-bottom: 12px; border-radius: 50%; color: #fff; background: #52c41a; font-size: 22px; font-weight: 700; }
    .result-icon.is-off { background: #8c8c8c; font-size: 18px; }
    .result-title { margin: 0 0 6px; color: var(--text); font-size: 16px; font-weight: 500; }
    .result-desc { margin: 0 0 20px; color: var(--text-secondary); font-size: 13px; }
    .result-actions { display: flex; justify-content: center; gap: 12px; }
    .header-link { color: var(--text-secondary); text-decoration: none; }
    .header-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">C</span><span>酷哇话务中心</span></div>
    <div class="header-actions">
      <div class="switch-line"><span>事件接收</span><button id="receiveToggle" class="switch is-on" type="button" aria-label="切换事件接收" aria-pressed="true" data-receiving="true"></button></div>
      <span>09:39:00</span>
      <span>2026/08/07&nbsp;&nbsp;星期五</span>
      <a class="header-link" href="话务中心工作台.html">返回工作台</a>
    </div>
  </header>
  <main class="confirm-page">
    <section class="dialog-shell" aria-live="polite">
      <div id="confirmContent">
        <h1 class="dialog-title"><span class="warning-badge">!</span>请确认是否停止事件接收</h1>
        <p class="dialog-copy">停止后，系统将不再为你推送新上报的待判别事件；当前处理中和挂起中的事件不会受到影响。</p>
        <div class="dialog-actions"><button id="cancelButton" class="btn" type="button">取消</button><button id="confirmButton" class="btn btn-primary" type="button">确认停止</button></div>
      </div>
      <div id="cancelResult" class="result-panel">
        <div class="result-icon">✓</div><h2 class="result-title">事件接收保持开启</h2><p class="result-desc">系统将继续为你接收新的待判别事件。</p>
        <div class="result-actions"><button id="showConfirmFromCancel" class="btn" type="button">仍要停止</button><a class="btn btn-primary" href="话务中心工作台.html">返回工作台</a></div>
      </div>
      <div id="stopResult" class="result-panel">
        <div class="result-icon is-off">||</div><h2 class="result-title">事件接收已关闭</h2><p class="result-desc">你仍可继续处理已接收的事件。</p>
        <div class="result-actions"><button id="restartButton" class="btn btn-primary" type="button">重新开启接收</button><a class="btn" href="话务中心工作台.html">返回工作台</a></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="assets/common.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById('receiveToggle');
      var confirmContent = document.getElementById('confirmContent');
      var cancelResult = document.getElementById('cancelResult');
      var stopResult = document.getElementById('stopResult');
      function setToggle(on) { toggle.classList.toggle('is-on', on); toggle.dataset.receiving = String(on); toggle.setAttribute('aria-pressed', String(on)); }
      function show(section) { confirmContent.style.display = section === 'confirm' ? 'block' : 'none'; cancelResult.classList.toggle('is-visible', section === 'cancel'); stopResult.classList.toggle('is-visible', section === 'stop'); }
      document.getElementById('cancelButton').addEventListener('click', function () { setToggle(true); show('cancel'); window.CallCenterUI.toast('已保持事件接收开启', 'success'); });
      document.getElementById('confirmButton').addEventListener('click', function () { setToggle(false); show('stop'); window.CallCenterUI.toast('已停止事件接收', 'error'); });
      document.getElementById('showConfirmFromCancel').addEventListener('click', function () { show('confirm'); });
      document.getElementById('restartButton').addEventListener('click', function () { setToggle(true); show('cancel'); window.CallCenterUI.toast('事件接收已重新开启', 'success'); });
      toggle.addEventListener('click', function () { if (toggle.dataset.receiving === 'true') { show('confirm'); } else { setToggle(true); show('cancel'); window.CallCenterUI.toast('事件接收已重新开启', 'success'); } });
    })();
  </script>
</body>
</html>
