<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高优规则配置 - 话务中心后台</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    :root { --nav-active: #e6f4ff; --line: #f0f0f0; --text: #000000d9; --text-secondary: #00000073; --text-tertiary: #00000040; }
    * { box-sizing: border-box; }
    body { min-width: 980px; margin: 0; overflow-x: auto; background: #f0f2f5; }
    .header-actions { gap: 16px; }
    .app-shell { display: flex; min-height: calc(100vh - 64px); }
    .side-nav { width: 224px; flex: 0 0 224px; padding: 12px 0; border-right: 1px solid var(--line); background: #fff; }
    .side-nav-title { padding: 10px 24px 8px; color: var(--text-tertiary); font-size: 12px; line-height: 20px; }
    .nav-item { display: flex; align-items: center; height: 40px; margin: 2px 8px; padding: 0 16px; border-radius: 6px; color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: color .18s ease, background .18s ease; }
    .nav-item:hover { color: #1677ff; background: #f5faff; }
    .nav-item.is-active { color: #1677ff; background: var(--nav-active); font-weight: 500; }
    .nav-item-mark { width: 4px; height: 16px; margin-right: 12px; border-radius: 2px; background: transparent; }
    .nav-item.is-active .nav-item-mark { background: #1677ff; }
    .main-content { min-width: 0; flex: 1; padding: 24px; }
    .page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .page-title { margin: 0; color: var(--text); font-size: 20px; font-weight: 600; line-height: 30px; }
    .page-sub { color: var(--text-tertiary); font-size: 12px; }
    .rule-alert { padding: 12px 16px; border: 1px solid #91caff; border-radius: 8px; color: #003eb3; background: #e6f4ff; box-shadow: 0 1px 2px rgba(0, 0, 0, .02); font-size: 13px; line-height: 22px; }
    .rule-alert strong { font-weight: 600; }
    .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .rule-panel { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .03); transition: box-shadow .2s ease; }
    .rule-panel:hover { box-shadow: 0 4px 14px rgba(22, 119, 255, .08); }
    .rule-panel-head { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fafcff, #fff); }
    .rule-panel-title { color: var(--text); font-size: 14px; font-weight: 600; }
    .rule-panel-count { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; color: #1677ff; background: #e6f4ff; font-size: 12px; line-height: 20px; }
    .rule-search { padding: 12px 16px 0; }
    .rule-search .input { width: 100%; height: 32px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 6px; color: var(--text); background: #fff; font-size: 13px; outline: none; transition: border-color .18s ease, box-shadow .18s ease; }
    .rule-search .input::placeholder { color: var(--text-tertiary); }
    .rule-search .input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, .12); }
    .rule-list { display: grid; gap: 2px; padding: 12px 12px 16px; }
    .rule-list--projects { grid-template-columns: 1fr; }
    .rule-list--types { grid-template-columns: repeat(2, 1fr); }
    .check-item { display: flex; align-items: center; min-width: 0; height: 38px; gap: 8px; padding: 0 10px; border-radius: 6px; color: var(--text); font-size: 14px; cursor: pointer; transition: background .15s ease; }
    .check-item:hover { background: #f5faff; }
    .check-item input { flex: 0 0 auto; width: 15px; height: 15px; accent-color: #1677ff; cursor: pointer; }
    .check-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .check-empty, .view-empty { padding: 26px 0; color: var(--text-tertiary); font-size: 13px; text-align: center; }
    .view-list { display: flex; flex-wrap: wrap; gap: 14px; padding: 18px 18px 20px; }
    .view-item { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border: 1px solid #91caff; border-radius: 14px; color: #1677ff; background: #f0f7ff; font-size: 13px; line-height: 28px; }
    .view-item::before { width: 5px; height: 5px; margin-right: 7px; border-radius: 50%; background: #1677ff; content: ""; }
    .panel-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-ghost { border: 1px solid #d9d9d9; border-radius: 6px; color: var(--text); background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .02); }
    .btn-ghost:hover { border-color: #4096ff; color: #1677ff; background: #fff; }
    .btn-ghost:disabled { border-color: #d9d9d9; color: #00000040; background: #f5f5f5; cursor: not-allowed; box-shadow: none; }
    .panel-body { transition: opacity .18s ease; }
    .panel-body.is-switching { opacity: 0; }
    @media (max-width: 1100px) { .rule-grid { grid-template-columns: 1fr; } .rule-list--types { grid-template-columns: repeat(3, 1fr); } }
    body.is-embedded { min-width: 0; overflow: hidden; background: #f0f2f5; }
    body.is-embedded > .app-header, body.is-embedded .side-nav { display: none; }
    body.is-embedded .app-shell { min-height: 100vh; height: 100vh; }
    body.is-embedded .main-content { padding: 20px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">环</span><span>酷哇话务中心</span></div>
    <div class="header-actions">
      <span class="user-name" style="color:var(--text)">高优规则配置</span>
      <a class="header-link" href="话务中心工作台.html">返回工作台</a>
    </div>
  </header>

  <div class="app-shell">
    <aside class="side-nav" aria-label="后台导航">
      <div class="side-nav-title">后台管理</div>
      <a class="nav-item" href="后台任务明细.html"><span class="nav-item-mark" aria-hidden="true"></span><span>事件记录明细</span></a>
      <a class="nav-item is-active" href="高优规则配置.html" aria-current="page"><span class="nav-item-mark" aria-hidden="true"></span><span>高优规则配置</span></a>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h3 class="page-title">高优规则配置</h3>
        <span class="page-sub">配置变更在保存后生效</span>
      </div>

      <div class="rule-alert" role="note">事件上报时，系统按以下两个维度自动判定高优先级——命中<strong>重点项目</strong>或命中<strong>重点问题类型</strong>，任一命中即视为高优先级。命中高优的事件在<strong>待处理、处理中、挂起中</strong>队列中优先排序，未命中的事件均为普通优先级；存量事件将在进入工作台时按当前配置自动重算。</div>

      <div class="rule-grid">
        <section class="rule-panel" aria-label="重点项目配置">
          <div class="rule-panel-head">
            <div class="rule-panel-title">重点项目</div>
            <span id="projectCount" class="rule-panel-count">已选 0 项</span>
          </div>
          <div id="projectSearchWrap" class="rule-search" hidden><input id="projectSearch" class="input" type="search" placeholder="搜索项目" aria-label="搜索项目"></div>
          <div id="projectBody" class="panel-body"><div id="projectList" class="rule-list rule-list--projects"></div></div>
        </section>

        <section class="rule-panel" aria-label="重点问题类型配置">
          <div class="rule-panel-head">
            <div class="rule-panel-title">重点问题类型</div>
            <span id="typeCount" class="rule-panel-count">已选 0 项</span>
          </div>
          <div id="typeSearchWrap" class="rule-search" hidden><input id="typeSearch" class="input" type="search" placeholder="搜索问题类型" aria-label="搜索问题类型"></div>
          <div id="typeBody" class="panel-body"><div id="typeList" class="rule-list rule-list--types"></div></div>
        </section>
      </div>

      <div class="panel-actions">
        <button id="enterEdit" class="btn btn-primary" type="button">编辑配置</button>
        <button id="discardChanges" class="btn btn-ghost" type="button" disabled hidden>放弃更改</button>
        <button id="saveConfig" class="btn btn-primary" type="button" disabled hidden>保存配置</button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/common.js"></script>
  <script>
    (function () {
      if (new URLSearchParams(window.location.search).get('embed') === '1') document.body.classList.add('is-embedded');
      var KEY = 'cc_high_priority_rules';
      var DEFAULT_RULES = { projects: ['上海市远香湖项目'], types: ['垃圾满溢', '道路积水'] };
      var ALL_PROJECTS = ['上海市远香湖项目', '嘉定新城保洁项目', '上海汽车城项目'];
      var ALL_TYPES = ['明显垃圾', '大面积落叶', '路面破损', '废弃家具设施', '垃圾桶脏污', '宠物粪便', '未知', '垃圾满溢', '路面污渍', '建筑垃圾', '绿化带漂浮物', '共享单车乱停', '果皮箱脏污', '道路积水', '烟蒂堆积'];
      function esc(v) { return String(v || '').replace(/[&<>"']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
      function cloneRules(r) { return { projects: r.projects.slice(), types: r.types.slice() }; }
      function loadRules() { try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved !== null && typeof saved === 'object' && Array.isArray(saved.projects) && Array.isArray(saved.types)) return saved; } catch (e) {} return cloneRules(DEFAULT_RULES); }
      function saveRules(r) { localStorage.setItem(KEY, JSON.stringify(r)); }

      var saved = loadRules();
      var draft = cloneRules(saved);
      var dirty = false;
      var mode = 'view';
      var projectSearch = '', typeSearch = '';

      function syncActions() {
        var editing = mode === 'edit';
        document.getElementById('enterEdit').hidden = editing;
        document.getElementById('saveConfig').hidden = !editing;
        document.getElementById('discardChanges').hidden = !editing;
        document.getElementById('saveConfig').disabled = !dirty;
        document.getElementById('discardChanges').disabled = !dirty;
        document.getElementById('projectSearchWrap').hidden = !editing;
        document.getElementById('typeSearchWrap').hidden = !editing;
      }
      function switchBody() {
        ['projectBody', 'typeBody'].forEach(function (id) {
          var el = document.getElementById(id);
          el.classList.add('is-switching');
          window.setTimeout(function () { el.classList.remove('is-switching'); }, 190);
        });
      }
      function renderViewList(listId, items, emptyText) {
        document.getElementById(listId).innerHTML = items.length
          ? items.map(function (item) { return '<span class="view-item">' + esc(item) + '</span>'; }).join('')
          : '<div class="view-empty">暂未配置，点击「编辑配置」添加</div>';
      }
      function renderCheckList(listId, options, items, query) {
        var filtered = options.filter(function (opt) { return !query || opt.indexOf(query) > -1; });
        document.getElementById(listId).innerHTML = filtered.length ? filtered.map(function (opt) {
          return '<label class="check-item"><input type="checkbox" data-opt="' + esc(opt) + '" ' + (items.indexOf(opt) > -1 ? 'checked' : '') + '><span>' + esc(opt) + '</span></label>';
        }).join('') : '<div class="check-empty">未找到匹配项</div>';
      }
      function render() {
        document.getElementById('projectCount').textContent = '已选 ' + draft.projects.length + ' 项';
        document.getElementById('typeCount').textContent = '已选 ' + draft.types.length + ' 项';
        if (mode === 'view') {
          renderViewList('projectList', saved.projects, '');
          renderViewList('typeList', saved.types, '');
        } else {
          renderCheckList('projectList', ALL_PROJECTS, draft.projects, projectSearch);
          renderCheckList('typeList', ALL_TYPES, draft.types, typeSearch);
        }
        syncActions();
      }
      function bindCheckList(listId, key) {
        document.getElementById(listId).addEventListener('change', function (e) {
          var cb = e.target.closest('input[type="checkbox"]');
          if (!cb) return;
          var opt = cb.dataset.opt, items = draft[key], idx = items.indexOf(opt);
          if (cb.checked && idx === -1) items.push(opt);
          if (!cb.checked && idx > -1) items.splice(idx, 1);
          dirty = true; render();
        });
      }
      bindCheckList('projectList', 'projects');
      bindCheckList('typeList', 'types');
      document.getElementById('projectSearch').addEventListener('input', function () { projectSearch = this.value.trim(); render(); });
      document.getElementById('typeSearch').addEventListener('input', function () { typeSearch = this.value.trim(); render(); });
      document.getElementById('enterEdit').addEventListener('click', function () {
        draft = cloneRules(saved);
        dirty = false; mode = 'edit'; switchBody(); render();
      });
      document.getElementById('saveConfig').addEventListener('click', function () {
        saved = cloneRules(draft);
        saveRules(saved);
        dirty = false; mode = 'view'; switchBody(); render();
        window.CallCenterUI.toast('配置已保存，工作台生效');
      });
      document.getElementById('discardChanges').addEventListener('click', function () {
        draft = cloneRules(saved);
        dirty = false; mode = 'view'; switchBody(); render();
        window.CallCenterUI.toast('已放弃未保存的更改');
      });
      render();
    })();
  </script>
</body>
</html>
